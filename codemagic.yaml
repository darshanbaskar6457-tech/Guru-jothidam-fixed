workflows:
  guru-jothidam-android:
    name: Guru Jothidam Android - Final
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Set Android SDK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install Gradle 8.7
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          curl -fL --retry 3 \
            -o gradle-8.7-bin.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q -o gradle-8.7-bin.zip

          test -x "$CM_BUILD_DIR/gradle-8.7/bin/gradle"

          "$CM_BUILD_DIR/gradle-8.7/bin/gradle" --version

      - name: Clean Android project
        script: |
          set -e
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"

          "$CM_BUILD_DIR/gradle-8.7/bin/gradle" \
            --no-daemon clean

      - name: Build installable APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"

          "$CM_BUILD_DIR/gradle-8.7/bin/gradle" \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        script: |
          set -e

          APK="$CM_BUILD_DIR/GuruJothidamAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$CM_BUILD_DIR/GuruJothidamAndroid/app/build/outputs" \
              -type f -print || true
            exit 1
          fi

          echo "======================================"
          echo "SUCCESS: APK CREATED"
          echo "======================================"
          ls -lh "$APK"

    artifacts:
      - GuruJothidamAndroid/app/build/outputs/apk/debug/app-debug.apk
