workflows:
  guru-jothidam-android:
    name: Guru Jothidam Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Set Android SDK location
        script: |
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Check project
        script: |
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"
          echo "=== Java ==="
          java -version
          echo "=== Project ==="
          ls -la

      - name: Prepare Gradle
        script: |
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"

          if [ ! -f gradlew ]; then
            echo "Creating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Clean
        script: |
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"
          ./gradlew clean

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        script: |
          cd "$CM_BUILD_DIR/GuruJothidamAndroid"

          find app/build/outputs -name "*.apk" -type f -print

          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

    artifacts:
      - GuruJothidamAndroid/app/build/outputs/**/*.apk
